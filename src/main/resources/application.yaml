spring:
  application:
    name: aisocket

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_rag_db
    username: admin
    password: password123!
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini

app:
  vector-store:
    table-name: vector_store
    dimensions: 1536
    initialize-schema: true

  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32bytes-minimum}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
