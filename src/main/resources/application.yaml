spring:
  application:
    name: aisocket

  main:
    web-application-type: reactive

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ai_rag_db
    username: admin
    password: password123!

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini

app:
  vector-store:
    table-name: vector_store
    dimensions: 1536
    initialize-schema: true
